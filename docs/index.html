<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atmo Weather Card — Live Demo</title>
<style>
  html, body { margin: 0; background: #0d1117; font-family: -apple-system, sans-serif; color: #e6edf3; }
  .wrap { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p { color: #9198a1; font-size: 14px; margin-top: 0; }
  .note {
    color: #d29922; font-size: 12.5px; background: rgba(210,153,34,0.1);
    border: 1px solid rgba(210,153,34,0.3); border-radius: 6px;
    padding: 6px 10px; margin: 10px 0 16px;
  }
  atmo-weather-card { display: block; width: 100%; margin: 16px 0; }
  .group-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: #6e7681; margin: 10px 0 4px;
  }
  #controls { display: flex; gap: 6px; flex-wrap: wrap; }
  #daynight, #perf, #wstyle, #wspeed, #wdir { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; margin-bottom: 12px; }
  button {
    background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #30363d; }
  button.active { background: #2ea44f; border-color: #2ea44f; }
  #now-label { font: 13px monospace; color: #6ea8fe; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Atmo Weather Card — Live Demo</h1>
  <p>Click a weather condition or Day/Night to switch the scene instantly.</p>
  <div class="note">Note: clouds fade in after ~1s — intentional, for performance reasons.</div>

  <div class="group-label">Weather</div>
  <div id="controls"></div>

  <div class="group-label">Time of day</div>
  <div id="daynight">
    <button id="btn-day">☀️ Day</button>
    <button id="btn-night">🌙 Night</button>
  </div>

  <div class="group-label">Performance</div>
  <div id="perf">
    <button data-perf="low">Low (24 fps)</button>
    <button data-perf="default">Standard (30 fps)</button>
    <button data-perf="ultra" class="active">Ultra (60 fps)</button>
  </div>

  <div class="group-label">Wind display</div>
  <div id="wstyle">
    <button data-v="lines" class="active">Wind lines</button>
    <button data-v="flow">Flow field</button>
    <button data-v="off">Off</button>
  </div>

  <div class="group-label">Wind speed (rain, hail and snow show wind from 40 km/h)</div>
  <div id="wspeed">
    <button data-v="10">10 km/h</button>
    <button data-v="25" class="active">25 km/h</button>
    <button data-v="50">50 km/h</button>
    <button data-v="90">90 km/h</button>
  </div>

  <div class="group-label">Wind from</div>
  <div id="wdir">
    <button data-v="270" class="active">West</button>
    <button data-v="90">East</button>
    <button data-v="180">South</button>
    <button data-v="0">North</button>
    <button data-v="225">South-west</button>
  </div>

  <div id="now-label">loading…</div>
</div>
<script type="module">
  import './atmo-weather-card.js';

  // Sortiert nach Kategorie: klar/bewölkt -> windig -> Regen -> Sturm -> Schnee
  const CONDITIONS = [
    'sunny', 'partlycloudy', 'cloudy', 'fog',
    'windy', 'windy-variant',
    'rainy', 'pouring',
    'lightning', 'lightning-rainy',
    'hail',
    'snowy', 'snowy-rainy'
  ];

  // Anzeige-Texte für Buttons, wo der Rohname (data-cond) missverständlich wäre.
  // Der interne Wert (data-cond) bleibt exakt der WEATHER_MAP-Key der Karte.
  const LABELS = {
    sunny: 'Sunny / Clear',
  };

  // Every mode runs at the same speed; Ultra is only smoother and more detailed.
  let currentPerf = 'ultra';
  let windStyle = 'lines';
  let windSpeed = 25;
  let windBearing = 270;

  function buildConfig(night) {
    return {
      type: 'custom:atmo-weather-card',
      weather_entity: 'weather.demo',
      sun_entity: 'sun.sun',
      moon_phase_entity: 'sensor.mond_phase',
      theme_entity: 'sun.sun',
      card_height: 200,
      card_padding: '16px',
      celestial_size: 65,
      celestial_position: 'dynamic_both',
      celestial_alignment: 'right',
      celestial_x: 45,
      celestial_y: 'center',
      chip_area_position: 'bottom-center',
      chip_text_size: '12px',
      chip_area_align: 'spread',
      chip_padding: '6px 10px',
      chip_gap: '8px',
      perf_mode: currentPerf,
      wind_style: windStyle,
      perf_fauna: currentPerf === 'low' ? 0 : night ? 1 : 2,
      fauna_bird_density: 1.3,
      fauna_bird_flock_size: 8,
      fauna_birds_at_night: false,
      chips: [{
        position: 'custom', position_anchor: 'center',
        position_x: '16px', position_y: '16px',
        text_size: '50px', padding: '0px 4px',
        hide_icon: true, fancy_unit: true,
        entity: 'sensor.time', background: false,
        hide_label: true, value_weight: '600',
        label_overflow: 'marquee'
      }],
      grid_options: { rows: 'auto' }
    };
  }

  const card = document.createElement('atmo-weather-card');
  card.setConfig(buildConfig(false));
  document.querySelector('.wrap').insertBefore(card, document.querySelector('.group-label'));

  let currentCondition = 'sunny';
  let currentNight = false;

  const nowIso = () => new Date().toISOString();
  const nowLabel = document.getElementById('now-label');

  function buildHass() {
    return {
      states: {
        'weather.demo': {
          entity_id: 'weather.demo', state: currentCondition,
          attributes: { temperature: 15, temperature_unit: '°C',
            wind_speed: windSpeed, wind_bearing: windBearing,
            wind_speed_unit: 'km/h', friendly_name: 'Demo' }
        },
        'sun.sun': {
          entity_id: 'sun.sun',
          state: currentNight ? 'below_horizon' : 'above_horizon',
          attributes: { elevation: currentNight ? -8 : 35 }
        },
        'sensor.mond_phase': { entity_id: 'sensor.mond_phase', state: 'waxing_gibbous', attributes: {} },
        'sensor.time': { entity_id: 'sensor.time', state: nowIso(), attributes: {} }
      },
      themes: { darkMode: currentNight },
      locale: { language: 'en' },
      config: { latitude: 52.15, longitude: 7.32, unit_system: { temperature: '°C' } },
      formatEntityState: (s) => s.state,
      formatEntityAttributeValue: (s, a) => String(s.attributes[a])
    };
  }

  function refreshLabel() {
    nowLabel.textContent = `${currentCondition} · ${currentNight ? 'Night' : 'Day'}`;
  }

  function applyScene(condition, night) {
    const nightChanged = night !== currentNight;
    currentCondition = condition;
    currentNight = night;
    if (nightChanged) card.setConfig(buildConfig(night));
    card.hass = buildHass();
    refreshLabel();

    document.querySelectorAll('#controls button').forEach(b =>
      b.classList.toggle('active', b.dataset.cond === condition)
    );
    document.getElementById('btn-day').classList.toggle('active', !night);
    document.getElementById('btn-night').classList.toggle('active', night);
  }

  const controls = document.getElementById('controls');
  for (const cond of CONDITIONS) {
    const btn = document.createElement('button');
    btn.textContent = LABELS[cond] || cond;
    btn.dataset.cond = cond;
    btn.addEventListener('click', () => applyScene(cond, currentNight));
    controls.appendChild(btn);
  }
  document.getElementById('btn-day').addEventListener('click', () => applyScene(currentCondition, false));
  document.getElementById('btn-night').addEventListener('click', () => applyScene(currentCondition, true));
  // Wind controls: the style needs a new config, speed and direction only new data.
  const pick = (id, onPick) => document.querySelectorAll(`#${id} button`).forEach((btn) =>
    btn.addEventListener('click', () => {
      document.querySelectorAll(`#${id} button`).forEach((b) => b.classList.toggle('active', b === btn));
      onPick(btn.dataset.v);
    }));
  pick('wstyle', (v) => { windStyle = v; card.setConfig(buildConfig(currentNight)); card.hass = buildHass(); });
  pick('wspeed', (v) => { windSpeed = Number(v); card.hass = buildHass(); });
  pick('wdir', (v) => { windBearing = Number(v); card.hass = buildHass(); });

  document.querySelectorAll('#perf button').forEach((btn) => btn.addEventListener('click', () => {
    currentPerf = btn.dataset.perf;
    document.querySelectorAll('#perf button').forEach((b) => b.classList.toggle('active', b === btn));
    card.setConfig(buildConfig(currentNight));
    card.hass = buildHass();
  }));

  setInterval(() => {
    const h = buildHass();
    h.states['sensor.time'] = { ...h.states['sensor.time'], state: nowIso() };
    card.hass = h;
  }, 1000);

  applyScene('sunny', false);
</script>
</body>
</html>
