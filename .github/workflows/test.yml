name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check that dist and docs are up to date
        run: |
          git status --porcelain -- dist docs
          test -z "$(git status --porcelain -- dist docs)"

      - name: Run tests with coverage limits
        run: npm run test:coverage
